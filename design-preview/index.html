const SIZES = [12, 14, 16, 20, 24, 32, 48, 64, 80];

function weightLabel(w) {
  return { 100:'Thin', 200:'ExtraLight', 300:'Light', 400:'Regular', 500:'Medium', 600:'SemiBold', 700:'Bold', 800:'ExtraBold', 900:'Black' }[w] || w;
}

function specimenBlock(label, family, weights, sampleText) {
  const rows = weights.map(w => `
    <div class="specimen-row">
      <span class="specimen-weight-label">${w} ${weightLabel(w)}</span>
      <span class="specimen-text" style="font-family:${family};font-weight:${w};">${sampleText}</span>
    </div>`).join('');
  return `<div class="specimen-block"><p class="specimen-title">${label}</p>${rows}</div>`;
}

function sizeBlock(label, family, weight, sampleEn, sampleJa) {
  const rows = SIZES.map(s => `
    <div class="size-row">
      <span class="size-label">${s}px</span>
      <span class="size-text" style="font-family:${family};font-weight:${weight};font-size:${s}px;">${s >= 32 ? sampleEn : sampleJa}</span>
    </div>`).join('');
  return `<div class="specimen-block"><p class="specimen-title">${label} — Size Scale (w${weight})</p>${rows}</div>`;
}

const container = document.getElementById('font-sections');

  const section = document.createElement('section');

  section.id = f.id;
  section.innerHTML = `
